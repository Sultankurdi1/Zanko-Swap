name: zankoswap
description: ZankoSwap - Student marketplace and academic exchange for Kurdistan/Iraq.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.17.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  google_sign_in: ^6.2.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.0.0
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.3
  http: ^1.6.0
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  pdfrx: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#080D22"
  android_12:
    color: "#080D22"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fastpay_qr.jpg
    - assets/fib_qr.jpg
