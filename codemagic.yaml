workflows:
  ios-release:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ZankoSwap App Store key
    environment:
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zankoswap.app
    scripts:
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$((BUILD_NUMBER + 2)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android Play Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.9
      android_signing:
        - zankoswap_upload_key
    scripts:
      - name: Write signing config
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build app bundle
        script: flutter build appbundle --release --build-number=$((BUILD_NUMBER + 2))
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  ios-unsigned:
    name: iOS test build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build unsigned IPA
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/archive/*.xcarchive
