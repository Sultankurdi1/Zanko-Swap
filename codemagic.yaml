workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Create iOS platform files
        script: flutter create . --platforms=ios
      - name: Generate Podfile manually if missing
        script: |
          cd ios
          if [ ! -f "Podfile" ]; then
            pod init
          fi
          pod install
      - name: Build iOS App
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - "/outputs//*.ipa"
      - "*.ipa"