workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Create iOS platform files
        script: flutter create . --platforms=ios
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS App
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa