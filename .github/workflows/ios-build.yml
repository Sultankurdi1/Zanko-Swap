name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Patch Xcode project for unsigned build (Before any build)
        run: |
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['DEVELOPMENT_TEAM'] = '1234567890'
                config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
              end
            end
            project.save
            puts 'Patched Runner.xcodeproj successfully before build.'
          "

      - name: Build iOS App (unsigned)
        env:
          FLUTTER_DISABLE_SWIFT_PACKAGE_MANAGER: true
        run: |
          flutter build ios --release --no-codesign

      - name: Create IPA Package
        run: |
          mkdir -p build/ios/ipa/Payload
          
          APP_PATH=$(find build/ios -type d -name "Runner.app" | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            cp -R "$APP_PATH" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -qq -r ZankoSwap.ipa Payload
            echo "Successfully created ZankoSwap.ipa"
          else
            echo "ERROR: Runner.app not found."
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZankoSwap-iOS-IPA
          path: build/ios/ipa/ZankoSwap.ipa