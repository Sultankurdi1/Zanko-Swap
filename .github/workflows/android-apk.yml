name: Build Android test APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E '^ *(info|warning|error) ' analyze.txt | sed -E 's/^ *//' | while IFS= read -r line; do
            echo "::warning::$line"
          done
          exit $code

      - name: Run tests
        run: flutter test

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/upload-keystore.p12"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid. Paste the whole keystore-base64.txt file again."
            exit 1
          fi
          if ! keytool -list -storetype pkcs12 -keystore "$RUNNER_TEMP/upload-keystore.p12" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened. Check ANDROID_KEYSTORE_PASSWORD, or paste keystore-base64.txt again."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.p12
          storeType=pkcs12
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          EOF

      - name: Build APK and Play Store bundle
        run: |
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          flutter build apk --release --build-number=$BUILD_NUMBER
          flutter build appbundle --release --build-number=$BUILD_NUMBER

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ZankoSwap-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v5
        with:
          name: ZankoSwap-play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
