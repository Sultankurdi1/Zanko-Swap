<!DOCTYPE html><html lang="ckb"><head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ZankoSwap — ئەپی بازاڕی قوتابیانی کوردستان. کتێب بکڕە و بفرۆشە، توێژینەوە و داشکاندنی قوتابیان.">
  <meta name="theme-color" content="#071D16">
  <!-- Preview card when a link is shared in Telegram, WhatsApp, Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ZankoSwap">
  <meta property="og:title" content="ZankoSwap — بازاڕی قوتابیانی کوردستان">
  <meta property="og:description" content="کتێب و کەرەستەی خوێندن بکڕە، بفرۆشە و ئاڵوگۆڕ بکە. بەخۆڕاییە.">
  <meta property="og:image" content="https://zankoswap.pages.dev/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- Installable app (Add to Home Screen) on iOS and Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default": the app starts below the status bar. "black-translucent"
       made iOS give Flutter the wrong screen height, so bottom buttons
       could not be tapped in the Home Screen app. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ZankoSwap">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>ZankoSwap</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style id="install-style">
    #zs-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #071D16; z-index: 2147483646;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: #A7F3D0;
    }
    #zs-loading img { width: 96px; height: 96px; border-radius: 22px; }
    #zs-loading .bar {
      width: 140px; height: 4px; border-radius: 2px; overflow: hidden;
      background: rgba(255,255,255,.12);
    }
    #zs-loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #10B981; border-radius: 2px;
      animation: zs-slide 1.1s ease-in-out infinite;
    }
    @keyframes zs-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }

    #zs-install {
      /* At the top, so it never covers the app's bottom buttons. */
      position: fixed; left: 12px; right: 12px; top: 12px;
      max-width: 460px; margin: 0 auto; z-index: 2147483647;
      display: none; direction: rtl; text-align: right;
      background: #0C271E; color: #ECFDF5;
      border: 1px solid #10B98155; border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.45);
      padding: 14px; gap: 12px; align-items: flex-start;
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    #zs-install.show { display: flex; }
    #zs-install img { width: 52px; height: 52px; border-radius: 12px; flex: none; }
    #zs-install .txt { flex: 1; min-width: 0; }
    #zs-install b { display: block; font-size: 16px; }
    #zs-install .how { color: #A7F3D0; font-size: 14px; margin-top: 2px; }
    #zs-install .how svg { width: 18px; height: 18px; vertical-align: -4px; }
    #zs-install .row { display: flex; gap: 8px; margin-top: 10px; }
    #zs-install button {
      font: inherit; border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer;
    }
    #zs-install .go { background: #10B981; color: #04120D; font-weight: 700; }
    #zs-install .later { background: transparent; color: #A7F3D0; }
  </style>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FBF8F0;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="zs-loading">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
    <div>چاوەڕێ بکە…</div>
  </div>

  <div id="zs-install" role="dialog" aria-label="ZankoSwap">
    <img src="icons/Icon-192.png" alt="">
    <div class="txt">
      <b>ZankoSwap بخە سەر شاشەی مۆبایلەکەت</b>
      <div class="how" id="zs-how"></div>
      <div class="row">
        <button class="go" id="zs-go" type="button">دامەزراندن</button>
        <button class="later" id="zs-later" type="button">دواتر</button>
      </div>
    </div>
  </div>

  <script>
    // Hide the loading screen once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('zs-loading');
      if (el) el.remove();
    });

    // Service worker: needed to install the site as an app.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }

    // "Add to Home Screen" helper for phones.
    (function () {
      var box = document.getElementById('zs-install');
      var how = document.getElementById('zs-how');
      var go = document.getElementById('zs-go');
      var later = document.getElementById('zs-later');
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);
      var installed = window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
      var deferred = null;

      function dismissedRecently() {
        try {
          var t = Number(localStorage.getItem('zs-install-later') || 0);
          return Date.now() - t < 3 * 24 * 60 * 60 * 1000; // 3 days
        } catch (e) { return false; }
      }
      function show(html, withButton) {
        if (installed || dismissedRecently()) return;
        how.innerHTML = html;
        go.style.display = withButton ? '' : 'none';
        later.textContent = withButton ? 'دواتر' : 'باشە';
        setTimeout(function () { box.classList.add('show'); }, 2500);
      }
      later.onclick = function () {
        box.classList.remove('show');
        try { localStorage.setItem('zs-install-later', String(Date.now())); } catch (e) {}
      };

      var shareIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';

      // Android Chrome / Samsung / Edge: real one-tap install.
      window.addEventListener('beforeinstallprompt', function (e) {
        if (isIOS) return; // iPhones always use the Share-menu steps below.
        e.preventDefault();
        deferred = e;
        show('بە یەک کلیک وەک ئەپ دایبمەزرێنە.', true);
      });
      go.onclick = function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.finally(function () {
          deferred = null;
          box.classList.remove('show');
        });
      };
      window.addEventListener('appinstalled', function () {
        installed = true;
        box.classList.remove('show');
      });

      if (isIOS) {
        // iPhone/iPad: Apple allows no install button, so explain the steps.
        show('دوگمەی <b style="display:inline">Share</b> ' + shareIcon +
          ' لە خوارەوەی Safari دابگرە، پاشان <b style="display:inline">Add to Home Screen</b> هەڵبژێرە.', false);
      } else if (isAndroid) {
        // Browsers without the install event (e.g. Firefox): show the menu steps.
        setTimeout(function () {
          if (!deferred) {
            show('مێنیوی <b style="display:inline">⋮</b> ی وێبگەڕەکە بکەرەوە و ' +
              '<b style="display:inline">Add to Home screen</b> یان <b style="display:inline">Install app</b> هەڵبژێرە.', false);
          }
        }, 4000);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
